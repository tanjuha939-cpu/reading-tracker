<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер чтения</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    font-family: Arial;
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

input, select, button {
    margin: 5px 0;
    padding: 8px;
    width: 100%;
}

.book {
    border: 1px solid #ccc;
    padding: 10px;
    margin-top: 15px;
    border-radius: 10px;
    display: flex;
    gap: 15px;
}

.book img {
    width: 100px;
    height: 150px;
    object-fit: cover;
}

.progress {
    height: 10px;
    background: #eee;
    border-radius: 5px;
}

.progress-bar {
    height: 10px;
    background: green;
    border-radius: 5px;
}

.stats {
    background: #f5f5f5;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 10px;
}

/* 📱 мобильная версия */
@media (max-width: 600px) {
    .book {
        flex-direction: column;
        align-items: center;
    }

    .book img {
        width: 120px;
        height: 180px;
    }
}
</style>
</head>

<body>

<h2>📚 Трекер чтения</h2>

<div class="stats" id="stats"></div>

<h3 id="formTitle">Добавить книгу</h3>

<input id="title" placeholder="Название">
<input id="author" placeholder="Автор">

<input id="totalPages" type="number" placeholder="Всего страниц">
<input id="pagesPerDay" type="number" placeholder="Страниц в день">

<input id="image" type="file" onchange="previewImage()">

<img id="preview" style="max-width:120px; display:none; margin-top:10px;">

<button onclick="saveBook()" id="saveBtn">Добавить</button>

<hr>

<select id="sort" onchange="render()">
    <option value="date">Сортировка: дата</option>
    <option value="progress">Сортировка: прогресс</option>
    <option value="title">Сортировка: название</option>
</select>

<select id="filter" onchange="render()">
    <option value="all">Все</option>
    <option value="reading">Читаю</option>
    <option value="done">Прочитано</option>
</select>

<div id="books"></div>

<script>
let books = JSON.parse(localStorage.getItem('books')) || [];
let editId = null;

function save() {
    localStorage.setItem('books', JSON.stringify(books));
}

function formatDate() {
    let d = new Date();
    return String(d.getDate()).padStart(2,'0') + '.' +
           String(d.getMonth()+1).padStart(2,'0') + '.' +
           d.getFullYear();
}

function previewImage() {
    const file = document.getElementById('image').files[0];
    const preview = document.getElementById('preview');

    if (file) {
        const reader = new FileReader();
        reader.onload = e => {
            preview.src = e.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
}

function saveBook() {
    const title = document.getElementById('title').value;
    const author = document.getElementById('author').value;
    const totalPages = parseInt(document.getElementById('totalPages').value);
    const pagesPerDay = parseInt(document.getElementById('pagesPerDay').value);
    const file = document.getElementById('image').files[0];

    if (!title || !author || !totalPages || !pagesPerDay) {
        alert("Заполни все поля");
        return;
    }

    const handleSave = (imageData) => {
        if (editId) {
            const book = books.find(b => b.id === editId);
            book.title = title;
            book.author = author;
            book.totalPages = totalPages;
            book.pagesPerDay = pagesPerDay;
            if (imageData) book.image = imageData;
        } else {
            books.push({
                id: Date.now(),
                title,
                author,
                totalPages,
                pagesPerDay,
                readPages: 0,
                date: formatDate(),
                image: imageData || ""
            });
        }

        editId = null;
        clearForm();
        save();
        render();
    };

    if (file) {
        const reader = new FileReader();
        reader.onload = e => handleSave(e.target.result);
        reader.readAsDataURL(file);
    } else {
        handleSave(null);
    }
}

function clearForm() {
    document.getElementById('title').value = '';
    document.getElementById('author').value = '';
    document.getElementById('totalPages').value = '';
    document.getElementById('pagesPerDay').value = '';
    document.getElementById('image').value = '';
    document.getElementById('preview').style.display = 'none';
}

function updatePages(id, value) {
    const book = books.find(b => b.id === id);
    book.readPages = Math.min(parseInt(value) || 0, book.totalPages);
    save();
    render();
}

function render() {
    let container = document.getElementById('books');
    let stats = document.getElementById('stats');
    container.innerHTML = '';

    let totalPages = 0, totalRead = 0;

    books.forEach(b => {
        totalPages += b.totalPages;
        totalRead += b.readPages;
    });

    stats.innerHTML = `📚 ${books.length} книг | 📄 ${totalPages} стр | ✅ ${totalRead} прочитано`;

    books.forEach(book => {
        const percent = ((book.readPages / book.totalPages) * 100).toFixed(1);
        const remaining = book.totalPages - book.readPages;

        const totalDays = Math.ceil(book.totalPages / book.pagesPerDay);
        const remainingDays = Math.ceil(remaining / book.pagesPerDay);

        const status = book.readPages >= book.totalPages ? "Прочитано" : "Читаю";

        container.innerHTML += `
        <div class="book">
            ${book.image ? `<img src="${book.image}">` : ''}

            <div>
                <strong>${book.title}</strong><br>
                ${book.author}<br>
                📅 ${book.date}<br>
                🏷 ${status}<br><br>

                <input type="number" value="${book.readPages}"
                    onchange="updatePages(${book.id}, this.value)">

                Осталось: ${remaining} стр<br>
                Прогресс: ${percent}%<br>

                📆 Всего дней: ${totalDays}<br>
                ⏳ Осталось дней: ${remainingDays}<br>

                <div class="progress">
                    <div class="progress-bar" style="width:${percent}%"></div>
                </div>
            </div>
        </div>
        `;
    });
}

render();

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
