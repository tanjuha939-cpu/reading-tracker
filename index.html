<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер чтения</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    font-family: Arial;
    margin: 0;
    padding: 15px;
    background: #fafafa;
}

h2 { text-align: center; }

.container {
    max-width: 600px;
    margin: auto;
}

/* форма */
.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

input, button, select {
    padding: 8px;
    font-size: 14px;
}

button {
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 6px;
}

.book {
    background: white;
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
    display: flex;
    gap: 10px;
}

.book img {
    width: 80px;
    height: 120px;
    object-fit: cover;
    border-radius: 6px;
}

.progress {
    height: 8px;
    background: #eee;
    border-radius: 5px;
    margin-top: 5px;
}

.progress-bar {
    height: 8px;
    background: #4CAF50;
    border-radius: 5px;
}

.actions button {
    margin-right: 5px;
    background: #ddd;
    color: black;
}

/* 📱 мобильная */
@media (max-width: 500px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h2>📚 Трекер чтения</h2>

<div class="form-grid">
<input id="title" placeholder="Название">
<input id="author" placeholder="Автор">

<input id="totalPages" type="number" placeholder="Всего страниц">
<input id="pagesPerDay" type="number" placeholder="Стр/день">

<input id="image" type="file" onchange="previewImage()">
<div></div>
</div>

<img id="preview" style="max-width:100px; display:none; margin-top:10px;">

<button onclick="saveBook()" id="saveBtn">Добавить</button>

<hr>

<select id="filter" onchange="render()">
<option value="all">Все</option>
<option value="reading">Читаю</option>
<option value="done">Прочитано</option>
</select>

<div id="books"></div>

</div>

<script>
let books = JSON.parse(localStorage.getItem('books')) || [];
let editId = null;

function save() {
    localStorage.setItem('books', JSON.stringify(books));
}

function formatDate() {
    let d = new Date();
    return String(d.getDate()).padStart(2,'0') + '.' +
           String(d.getMonth()+1).padStart(2,'0') + '.' +
           d.getFullYear();
}

function previewImage() {
    const file = document.getElementById('image').files[0];
    const preview = document.getElementById('preview');

    if (file) {
        const reader = new FileReader();
        reader.onload = e => {
            preview.src = e.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
}

function saveBook() {
    const title = document.getElementById('title').value;
    const author = document.getElementById('author').value;
    const totalPages = parseInt(document.getElementById('totalPages').value);
    const pagesPerDay = parseInt(document.getElementById('pagesPerDay').value);
    const file = document.getElementById('image').files[0];

    if (!title || !author || !totalPages || !pagesPerDay) {
        alert("Заполни все поля");
        return;
    }

    const finish = (img) => {
        if (editId) {
            let b = books.find(x => x.id === editId);
            b.title = title;
            b.author = author;
            b.totalPages = totalPages;
            b.pagesPerDay = pagesPerDay;
            if (img) b.image = img;
        } else {
            books.push({
                id: Date.now(),
                title,
                author,
                totalPages,
                pagesPerDay,
                readPages: 0,
                date: formatDate(),
                image: img || ""
            });
        }

        editId = null;
        clearForm();
        save();
        render();
    };

    if (file) {
        const reader = new FileReader();
        reader.onload = e => finish(e.target.result);
        reader.readAsDataURL(file);
    } else {
        finish(null);
    }
}

function clearForm() {
    document.getElementById('title').value = '';
    document.getElementById('author').value = '';
    document.getElementById('totalPages').value = '';
    document.getElementById('pagesPerDay').value = '';
    document.getElementById('image').value = '';
    document.getElementById('preview').style.display = 'none';
}

function editBook(id) {
    let b = books.find(x => x.id === id);

    document.getElementById('title').value = b.title;
    document.getElementById('author').value = b.author;
    document.getElementById('totalPages').value = b.totalPages;
    document.getElementById('pagesPerDay').value = b.pagesPerDay;

    editId = id;
}

function deleteBook(id) {
    books = books.filter(b => b.id !== id);
    save();
    render();
}

function updatePages(id, val) {
    let b = books.find(x => x.id === id);
    b.readPages = Math.min(parseInt(val)||0, b.totalPages);
    save();
    render();
}

function render() {
    let container = document.getElementById('books');
    container.innerHTML = '';

    let filter = document.getElementById('filter').value;
    let list = [...books];

    if (filter === 'reading') list = list.filter(b => b.readPages < b.totalPages);
    if (filter === 'done') list = list.filter(b => b.readPages >= b.totalPages);

    list.forEach(b => {
        let percent = ((b.readPages / b.totalPages) * 100).toFixed(1);
        let remaining = b.totalPages - b.readPages;
        let totalDays = Math.ceil(b.totalPages / b.pagesPerDay);
        let remainingDays = Math.ceil(remaining / b.pagesPerDay);
        let status = b.readPages >= b.totalPages ? "Прочитано" : "Читаю";

        container.innerHTML += `
        <div class="book">
            ${b.image ? `<img src="${b.image}">` : ''}

            <div>
                <b>${b.title}</b><br>
                ${b.author}<br>
                📅 ${b.date}<br>
                🏷 ${status}<br>

                <input type="number" value="${b.readPages}"
                 onchange="updatePages(${b.id}, this.value)">

                ${percent}% | ${remaining} стр<br>
                ⏳ ${remainingDays} из ${totalDays} дней<br>

                <div class="progress">
                    <div class="progress-bar" style="width:${percent}%"></div>
                </div>

                <div class="actions">
                    <button onclick="editBook(${b.id})">✏️</button>
                    <button onclick="deleteBook(${b.id})">🗑</button>
                </div>
            </div>
        </div>`;
    });
}

render();

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
