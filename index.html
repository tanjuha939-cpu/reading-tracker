<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Трекер чтения</title>

<link rel="manifest" href="manifest.json">

<style>
body { font-family: Arial; max-width: 900px; margin: auto; padding: 20px; }
input, select, button { margin: 5px; padding: 6px; }

.book {
    border: 1px solid #ccc;
    padding: 10px;
    margin-top: 15px;
    border-radius: 10px;
    display: flex;
    gap: 15px;
}

.book img { width: 80px; height: 120px; object-fit: cover; }

.progress { height: 10px; background: #eee; border-radius: 5px; }
.progress-bar { height: 10px; background: green; border-radius: 5px; }

.stats { background: #f5f5f5; padding: 10px; margin-bottom: 20px; border-radius: 10px; }
</style>
</head>

<body>

<h2>📚 Трекер чтения</h2>

<div class="stats" id="stats"></div>

<h3 id="formTitle">Добавить книгу</h3>
<input id="title" placeholder="Название">
<input id="author" placeholder="Автор"><br>

<input id="totalPages" type="number" placeholder="Всего страниц">
<input id="pagesPerDay" type="number" placeholder="Страниц в день"><br>

<input id="image" type="file"><br>

<button onclick="saveBook()" id="saveBtn">Добавить</button>

<hr>

<label>Сортировка:</label>
<select id="sort" onchange="render()">
    <option value="date">По дате</option>
    <option value="progress">По прогрессу</option>
    <option value="title">По названию</option>
</select>

<label>Фильтр:</label>
<select id="filter" onchange="render()">
    <option value="all">Все</option>
    <option value="reading">Читаю</option>
    <option value="done">Прочитано</option>
</select>

<div id="books"></div>

<script>
let books = JSON.parse(localStorage.getItem('books')) || [];
let editId = null;

function save() {
    localStorage.setItem('books', JSON.stringify(books));
}

function formatDate(date) {
    let d = new Date(date);
    let day = String(d.getDate()).padStart(2, '0');
    let month = String(d.getMonth() + 1).padStart(2, '0');
    let year = d.getFullYear();
    return `${day}.${month}.${year}`;
}

function saveBook() {
    const title = document.getElementById('title').value;
    const author = document.getElementById('author').value;
    const totalPages = parseInt(document.getElementById('totalPages').value);
    const pagesPerDay = parseInt(document.getElementById('pagesPerDay').value);
    const file = document.getElementById('image').files[0];

    if (!title || !author || !totalPages || !pagesPerDay) {
        alert("Заполни все поля");
        return;
    }

    const handleSave = (imageData) => {
        if (editId) {
            const book = books.find(b => b.id === editId);
            book.title = title;
            book.author = author;
            book.totalPages = totalPages;
            book.pagesPerDay = pagesPerDay;
            if (imageData) book.image = imageData;
        } else {
            books.push({
                id: Date.now(),
                title,
                author,
                totalPages,
                pagesPerDay,
                readPages: 0,
                date: formatDate(new Date()),
                image: imageData || ""
            });
        }

        editId = null;
        document.getElementById('saveBtn').innerText = "Добавить";
        document.getElementById('formTitle').innerText = "Добавить книгу";

        clearForm();
        save();
        render();
    };

    if (file) {
        const reader = new FileReader();
        reader.onload = e => handleSave(e.target.result);
        reader.readAsDataURL(file);
    } else {
        handleSave(null);
    }
}

function clearForm() {
    document.getElementById('title').value = '';
    document.getElementById('author').value = '';
    document.getElementById('totalPages').value = '';
    document.getElementById('pagesPerDay').value = '';
    document.getElementById('image').value = '';
}

function editBook(id) {
    const book = books.find(b => b.id === id);

    document.getElementById('title').value = book.title;
    document.getElementById('author').value = book.author;
    document.getElementById('totalPages').value = book.totalPages;
    document.getElementById('pagesPerDay').value = book.pagesPerDay;

    editId = id;

    document.getElementById('saveBtn').innerText = "Сохранить";
    document.getElementById('formTitle').innerText = "Редактирование";
}

function updatePages(id, value) {
    const book = books.find(b => b.id === id);
    book.readPages = Math.min(parseInt(value) || 0, book.totalPages);
    save();
    render();
}

function deleteBook(id) {
    books = books.filter(b => b.id !== id);
    save();
    render();
}

function render() {
    let container = document.getElementById('books');
    let stats = document.getElementById('stats');

    container.innerHTML = '';

    let list = [...books];

    const filter = document.getElementById('filter').value;
    if (filter === 'reading') list = list.filter(b => b.readPages < b.totalPages);
    if (filter === 'done') list = list.filter(b => b.readPages >= b.totalPages);

    const sort = document.getElementById('sort').value;

    if (sort === 'progress') {
        list.sort((a,b) => (b.readPages/b.totalPages) - (a.readPages/a.totalPages));
    }
    if (sort === 'title') {
        list.sort((a,b) => a.title.localeCompare(b.title));
    }
    if (sort === 'date') {
        list.sort((a,b) => new Date(b.date.split('.').reverse().join('-')) - new Date(a.date.split('.').reverse().join('-')));
    }

    let totalBooks = books.length;
    let totalPages = 0;
    let totalRead = 0;

    books.forEach(b => {
        totalPages += b.totalPages;
        totalRead += b.readPages;
    });

    let totalPercent = totalPages ? ((totalRead / totalPages) * 100).toFixed(1) : 0;

    stats.innerHTML = `
        📊 Книг: ${totalBooks} |
        📚 Всего страниц: ${totalPages} |
        ✅ Прочитано: ${totalRead} |
        📈 Общий прогресс: ${totalPercent}%
    `;

    list.forEach(book => {
        const percent = ((book.readPages / book.totalPages) * 100).toFixed(1);
        const remaining = book.totalPages - book.readPages;
        const days = Math.ceil(book.totalPages / book.pagesPerDay);

        const status = book.readPages >= book.totalPages ? "Прочитано" : "Читаю";

        container.innerHTML += `
        <div class="book">
            ${book.image ? `<img src="${book.image}">` : ''}

            <div>
                <strong>${book.title}</strong><br>
                Автор: ${book.author}<br>
                📅 ${book.date}<br>
                🏷 ${status}<br><br>

                Прочитано:
                <input type="number" value="${book.readPages}"
                    onchange="updatePages(${book.id}, this.value)"><br>

                Осталось: ${remaining}<br>
                Прогресс: ${percent}%<br>
                Дней: ${days}<br>

                <div class="progress">
                    <div class="progress-bar" style="width:${percent}%"></div>
                </div>

                <br>
                <button onclick="editBook(${book.id})">Редактировать</button>
                <button onclick="deleteBook(${book.id})">Удалить</button>
            </div>
        </div>
        `;
    });
}

render();

// регистрация service worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
